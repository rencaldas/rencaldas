name: generate contribution grid

on:
  schedule:
    - cron: "0 3 * * *"    # roda todo dia às 03:00 UTC (00:00 em Brasília)
  workflow_dispatch:        # permite disparo manual pela aba Actions
  push:
    branches:
      - main
      - master             # cobre os dois nomes possíveis da branch padrão

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # grid estatico (sem a animacao da cobra), com total, labels de mes/dia e legenda
      # os dados vem da pagina publica de contribuicoes, entao inclui as contribuicoes privadas
      # exibidas no perfil e nao precisa de token
      - name: generate contribution grid svgs
        env:
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          node scripts/contribution-grid.mjs dist/github-contribution-grid.svg --palette "#0B1224,#12305C,#1463F2,#0187FA,#7DD3FC"
          node scripts/contribution-grid.mjs dist/github-contribution-grid-dark.svg --palette "#0D1117,#143A73,#1463F2,#38BDF8,#BFDBFE" --dark

      # publica o conteúdo de dist/ na branch "output"
      # os arquivos ficam disponíveis em https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push grid svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
