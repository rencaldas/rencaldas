name: generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"    # roda todo dia às 03:00 UTC (00:00 em Brasília)
  workflow_dispatch:        # permite disparo manual pela aba Actions
  push:
    branches:
      - main
      - master             # cobre os dois nomes possíveis da branch padrão

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0187FA&color_dots=#0B1224,#12305C,#1463F2,#0187FA,#7DD3FC
            dist/github-contribution-grid-snake-dark.svg?color_snake=#38BDF8&color_dots=#0D1117,#143A73,#1463F2,#38BDF8,#BFDBFE

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: add contribution count and month/day labels to the snake svg
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PAT_READ_USER }}
        run: |
          node scripts/annotate-snake.mjs dist/github-contribution-grid-snake.svg
          node scripts/annotate-snake.mjs dist/github-contribution-grid-snake-dark.svg --dark

      # publica o conteúdo de dist/ na branch "output"
      # os arquivos ficam disponíveis em https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
